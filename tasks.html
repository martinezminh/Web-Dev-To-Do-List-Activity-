<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Board — Your Tasks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="brand-mark">
      <div class="brand-badge">
        <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>
      </div>
      <span class="brand-label dark">Mission Board</span>
    </div>
    <div class="header-right">
      <span class="user-name" id="user-name-label"></span>
      <button class="signout-btn" id="signout-btn">Sign Out</button>
    </div>
  </div>
</header>

<main class="board">
  <div class="board-header">
    <div>
      <p class="board-date" id="board-date"></p>
      <h1 class="board-title">Your Tasks</h1>
    </div>
    <button class="primary-btn" id="open-add-modal">
      <span style="font-size:18px; line-height:1;">+</span>
      <span>Add Task</span>
    </button>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="active">
      Active <span class="filter-count" id="count-active">0</span>
    </button>
    <button class="filter-tab" data-filter="inactive">
      Inactive <span class="filter-count" id="count-inactive">0</span>
    </button>
  </div>

  <div id="task-list-region">
    <div class="loading-state">Loading your missions…</div>
  </div>
</main>

<!-- Add Task Modal -->
<div class="modal-overlay" id="add-modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title">New Task</h3>
      <button class="modal-close" data-close="add-modal-overlay">✕</button>
    </div>
    <div id="add-status"></div>
    <form id="add-form" novalidate>
      <div class="field">
        <label class="field-label" for="add-title">Task title</label>
        <input class="auth-input" type="text" id="add-title" required placeholder="What needs to be done?">
      </div>
      <div class="field">
        <label class="field-label" for="add-desc">Description</label>
        <textarea class="auth-input" id="add-desc" rows="3" placeholder="Add details (optional)..."></textarea>
      </div>
      <div class="modal-actions" style="margin-top:20px;">
        <button type="button" class="ghost-btn" data-close="add-modal-overlay">Cancel</button>
        <button type="submit" class="primary-btn" id="add-submit">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Task Modal -->
<div class="modal-overlay" id="edit-modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title">Edit Task</h3>
      <button class="modal-close" data-close="edit-modal-overlay">✕</button>
    </div>
    <div id="edit-status"></div>
    <form id="edit-form" novalidate>
      <input type="hidden" id="edit-item-id">
      <div class="field">
        <label class="field-label" for="edit-title">Task title</label>
        <input class="auth-input" type="text" id="edit-title" required>
      </div>
      <div class="field">
        <label class="field-label" for="edit-desc">Description</label>
        <textarea class="auth-input" id="edit-desc" rows="3"></textarea>
      </div>
      <div class="modal-actions" style="margin-top:20px;">
        <button type="button" class="ghost-btn" data-close="edit-modal-overlay">Cancel</button>
        <button type="submit" class="primary-btn" id="edit-submit">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title">Delete Task</h3>
      <button class="modal-close" data-close="delete-modal-overlay">✕</button>
    </div>
    <p class="modal-text">Are you sure you want to delete this task? This action cannot be undone.</p>
    <div id="delete-status"></div>
    <div class="modal-actions">
      <button type="button" class="ghost-btn" data-close="delete-modal-overlay">Cancel</button>
      <button type="button" class="danger-btn" id="delete-confirm-btn">Delete</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="js/api.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
